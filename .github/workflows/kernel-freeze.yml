name: kernel-freeze
# Prove kernel.json and every vendored copy match the pinned grail commit.
on: [push, pull_request, workflow_dispatch]
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify canonical kernel pin
        run: python3 check_kernel_pin.py
      - name: Test distro spawner
        if: ${{ hashFiles('tests/test_spawn_distro.py') != '' }}
        run: python3 -m unittest -v tests/test_spawn_distro.py
